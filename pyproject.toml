[project]
name = "local-api"
version = "0.1.0"
description = "Local utility API for transcription, audio processing, and Obsidian exports."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pyyaml>=6.0.3",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "typing-extensions>=4.0.0",
]

[tool.uv]
package = false
